[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redragon-rgb"
version = "0.3.0"
description = "RGB lighting control for Redragon M711 Cobra mouse and K556 keyboard on Linux (GTK4/libadwaita)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
# PyGObject (GTK4 + libadwaita) and libusb-1.0 come from the distribution:
#   sudo apt install python3-gi gir1.2-adw-1 libusb-1.0-0

[project.scripts]
redragon-rgb = "redragon_rgb.gui:main"
redragon-rgb-cli = "redragon_rgb.cli:main"

[tool.setuptools]
packages = ["redragon_rgb"]
